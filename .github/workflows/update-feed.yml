name: Update daily brief RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '5 9 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove Xodus sections from article entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('feed.xml')
          text = path.read_text()
          pattern = re.compile(r'<h2>\\s*\\d+\\.\\s*XODUS\\s*</h2>.*?(?=<h2>\\s*\\d+\\.)', re.I | re.S)
          cleaned = pattern.sub('', text)
          cleaned = re.sub(r'<h2>\\s*\\d+\\.\\s*(FREE GAMES|LINUX APPS)\\s*</h2>', lambda m: '<h2>' + ('3. FREE GAMES' if m.group(1).upper() == 'FREE GAMES' else '4. LINUX APPS') + '</h2>', cleaned, flags=re.I)
          cleaned = re.sub(r'<description>\\s*<!\\[CDATA\\[(.*?)\\]\\]></description>', lambda m: '<description><![CDATA[' + re.sub(r'\\s*<hr\\s*/?>\\s*        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path('feed.xml')
          text = path.read_text()
          marker = '<!-- last-checked: '
          start = text.find(marker)
          if start != -1:
              end = text.find('-->', start)
              text = text[:start] + marker + datetime.now(timezone.utc).isoformat() + ' -->' + text[end+3:]
          else:
              text = text.replace('<rss version="2.0">', '<rss version="2.0">\n  <!-- last-checked: ' + datetime.now(timezone.utc).isoformat() + ' -->', 1)
          path.write_text(text)
          PY

      - name: Commit feed update
        run: |
          git config user.name 'daily-brief-rss bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          git diff --cached --quiet || git commit -m 'refresh RSS feed'
          git push
