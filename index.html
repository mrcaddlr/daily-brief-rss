<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>daily brief rss</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #17131c; color: #f4eefa; }
    main { width: min(680px, calc(100% - 40px)); padding: 42px 0; }
    .flower { font-size: 42px; }
    h1 { margin: 8px 0; font-size: clamp(32px, 7vw, 54px); }
    p { color: #cfc3d9; line-height: 1.7; }
    a { color: #f2b9df; }
    code { padding: 3px 7px; border-radius: 7px; background: #29222f; }
    .card { margin-top: 28px; padding: 22px; border: 1px solid #392f42; border-radius: 18px; background: #201a27; }
  </style>
</head>
<body>
  <main>
    <div class="flower">✿</div>
    <h1>daily brief rss</h1>
    <p>a tiny little RSS home for the daily gaming &amp; tech brief.</p>
    <div class="card">
      <strong>feed.xml</strong>
      <p>paste this feed into your favorite RSS reader and let the daily brief come to you.</p>
      <a href="feed.xml">open the RSS feed →</a>
    </div>
  </main>
</body>
</html>
